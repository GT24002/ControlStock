# =============================================================================
# Docker Compose para ControlStock - ENTORNO DE PRODUCCION (Simulacion)
# =============================================================================
# Este archivo configura los contenedores en su etapa "prod" (Produccion).
#
# Caracteristicas principales:
#   - Compilacion optimizada sin herramientas de desarrollo (Multi-stage).
#   - Sin bind-mounts de codigo fuente (maxima seguridad y rendimiento).
#   - Frontend servido por Nginx de alto rendimiento en puerto 80.
#   - Proxy Reverso para la API a traves de Nginx (evita problemas de CORS).
#   - Base de datos aislada y persistente en Named Volume de produccion.
#   - Nombres de contenedores e imagenes diferenciados de desarrollo para
#     permitir la ejecucion simultanea de ambos entornos.
#
# Para ejecutar esta configuracion:
#   docker compose -f docker-compose.prod.yml up --build -d
# =============================================================================

name: controlstock-prod

services:

  # ----------------------------------------------------------------------------
  # Servicio 1: PostgreSQL 16.13 (Base de Datos)
  # ----------------------------------------------------------------------------
  db:
    # Imagen ligera de PostgreSQL basada en Alpine Linux para produccion
    image: postgres:16.13-alpine3.23
    # Nombre personalizado del contenedor para entorno de produccion
    container_name: controlstock-db-prod
    # Indica que el contenedor debe reiniciarse siempre ante caidas
    restart: always
    environment:
      # Nombre de la base de datos de produccion
      POSTGRES_DB: controlstock
      # Usuario administrador para produccion
      POSTGRES_USER: admin_prod
      # Contrasena segura para el usuario administrador en produccion
      POSTGRES_PASSWORD: admin_production_password
    volumes:
      # Volumen persistente aislado para la base de datos de produccion
      - pgdata_prod:/var/lib/postgresql/data
      # Script SQL inicial de solo lectura para montar la estructura
      - ./database:/docker-entrypoint-initdb.d:ro
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    # Prueba de salud de la base de datos para asegurar disponibilidad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_prod -d controlstock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      # Red interna y aislada de produccion
      - controlstock-net-prod

  # ----------------------------------------------------------------------------
  # Servicio 2: Backend Spring Boot (Java 21 JRE)
  # ----------------------------------------------------------------------------
  backend:
    build:
      # Directorio del codigo fuente del backend
      context: ./backend/controlstock
      # Etapa de compilacion optimizada definida en el Dockerfile (prod)
      target: prod
    # Nombre asignado a la imagen de produccion
    image: controlstock-backend-prod:latest
    # Nombre del contenedor en ejecucion para backend produccion
    container_name: controlstock-backend-prod
    restart: always
    environment:
      # URL JDBC de conexion que apunta al contenedor db de produccion
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/controlstock
      # Credenciales de base de datos de produccion
      SPRING_DATASOURCE_USERNAME: admin_prod
      SPRING_DATASOURCE_PASSWORD: admin_production_password
      # Mantiene sincronizada la base de datos en base al modelo
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      # Expone el puerto interno 8080 del contenedor sin publicarlo en el host
      - "8080"
    ports:
      # Mapea el puerto 8081 del host al puerto 8080 del contenedor backend.
      # Esto evita conflictos con el puerto 8080 de desarrollo y permite
      # probar Swagger o la API en la maquina host directamente en el 8081.
      - "8081:8080"
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    # El backend espera a que la base de datos de produccion este saludable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - controlstock-net-prod

  # ----------------------------------------------------------------------------
  # Servicio 3: Frontend React + Nginx (Servidor Web)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      # Directorio del codigo fuente del frontend
      context: ./frontend/controlstock
      # Etapa de construccion de produccion (prod) que genera archivos estaticos
      # y los sirve usando Nginx optimizado
      target: prod
    # Nombre de la imagen de produccion del frontend
    image: controlstock-frontend-prod:latest
    # Nombre del contenedor de frontend para produccion
    container_name: controlstock-frontend-prod
    restart: always
    ports:
      # Mapea el puerto 80 de HTTP estandar del host al puerto 80 de Nginx
      - "80:80"
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    # Espera a que el backend de produccion este arriba
    depends_on:
      - backend
    networks:
      - controlstock-net-prod

# ------------------------------------------------------------------------------
# Red de Produccion Aislada
# ------------------------------------------------------------------------------
networks:
  controlstock-net-prod:
    # Nombre de la red de produccion
    name: controlstock_network_prod
    # Driver bridge para comunicacion local aislada
    driver: bridge

# ------------------------------------------------------------------------------
# Volumenes de Produccion Aislados
# ------------------------------------------------------------------------------
volumes:
  # Volumen para persistir los datos de base de datos de produccion
  pgdata_prod:
    name: controlstock_pgdata_prod
