# =============================================================================
# Configuracion de Nginx para servir la SPA de React en produccion
# =============================================================================
# Este archivo se copia al contenedor Nginx durante la etapa 'prod' del
# Dockerfile del frontend. Su proposito es triple:
#
# 1. Servir archivos estaticos (HTML, JS, CSS) compilados por Vite
#    con alta compresion Gzip y caching optimizado.
#
# 2. Implementar routing de SPA: cualquier ruta no encontrada en el
#    sistema de archivos se redirige a /index.html para que React
#    Router la procese en el cliente.
#
# 3. Actuar como proxy reverso para las peticiones /api/* hacia el
#    backend, eliminando la necesidad de configurar CORS en produccion
#    (ambos servicios se comunican internamente en la misma red Docker).
# =============================================================================


# ─── Contexto 'events' ──────────────────────────────────────────────────────
# Define la configuracion basica de conexiones del worker de Nginx.
events {
    # Numero maximo de conexiones simultaneas por worker process.
    worker_connections  1024;
}


# ─── Contexto 'http' ─────────────────────────────────────────────────────────
# Contiene toda la configuracion del servidor HTTP.
http {

    # Incluye la tabla de tipos MIME estandar (define como servir cada
    # tipo de archivo: .html, .js, .css, .png, etc.)
    include       /etc/nginx/mime.types;

    # Tipo MIME por defecto si Nginx no reconoce la extension del archivo.
    default_type  application/octet-stream;


    # ─── Compression Gzip ─────────────────────────────────────────────────
    # Reduce el tamano de las respuestas antes de enviarlas al navegador,
    # mejorando la velocidad de carga (especialmente archivos JS y CSS).
    gzip on;                          # Habilita compresion
    gzip_vary on;                     # Agrega header Vary: Accept-Encoding
    gzip_min_length 10240;            # Solo comprime respuestas > 10KB
    gzip_proxied expired no-cache no-store private auth;  # Aplica a respuestas proxy reverso
    gzip_types                        # Tipos de contenido a comprimir:
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript;
    gzip_disable "MSIE [1-6]\.";      # Desactiva para IE6 (no soporta gzip)


    # ─── Configuracion de envio de archivos ───────────────────────────────
    sendfile        on;               # Envia archivos usando el sistema
                                      # de archivos del kernel (mas rapido)
    keepalive_timeout  65;            # Timeout de conexiones persistentes


    # ─── Servidor virtual ─────────────────────────────────────────────────
    server {

        # Escucha en el puerto 80 (HTTP estandar) en IPv4 e IPv6
        listen       80;
        listen  [::]:80;

        # Nombre del servidor (localhost para entorno local)
        server_name  localhost;


        # ─── Location / : Servir la SPA de React ─────────────────────────
        # Sirve los archivos estaticos compilados por Vite (HTML, JS, CSS)
        # ubicados en /usr/share/nginx/html (carpeta donde se copio dist/).
        #
        # La directiva try_files es CRITICA para una SPA:
        #   1. $uri         → busca si existe el archivo exacto
        #   2. $uri/        → busca si existe el directorio
        #   3. /index.html  → si no encuentra nada, sirve index.html
        #                     (permite que React Router maneje la ruta)
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }


        # ─── Location /api/ : Proxy Reverso al Backend ───────────────────
        # Redirige todas las peticiones que comienzan con /api/ hacia el
        # contenedor del backend Spring Boot.
        #
        # Esto evita:
        #   - Configurar CORS en el backend (mismo origen: localhost:80)
        #   - Exponer puertos del backend directamente al cliente
        #   - Problemas de seguridad por origen cruzado
        location /api/ {
            # Proxy hacia el nombre del servicio en la red Docker
            # (backend-prod resuelve al contenedor del backend via DNS interno)
            # El nombre 'backend' resuelve al contenedor del backend en la red Docker.
            # En docker-compose, tanto backend-dev como backend-prod tienen un alias
            # de red 'backend' para que funcione en ambos entornos con la misma imagen.
            proxy_pass http://backend:8080/api/;

            # Configuracion de headers para el proxy reverso
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;                     # Preserva el Host original
            proxy_set_header X-Real-IP $remote_addr;         # IP real del cliente
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Cadena de IPs
            proxy_set_header X-Forwarded-Proto $scheme;       # Protocolo original (http/https)
            proxy_cache_bypass $http_upgrade;                 # Evita cache para WebSockets
        }

    }
}