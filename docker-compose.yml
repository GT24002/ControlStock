# =============================================================================
# Docker Compose para ControlStock (dev / prod)
# =============================================================================
# Cada perfil agrupa sus servicios bajo un nombre de proyecto distinto
# mediante el flag -p (project name) de Docker Compose.
#
# Comandos de uso:
#
# 1. MODO HIBRIDO (solo base de datos de desarrollo en Docker,
#    backend y frontend se ejecutan localmente):
#      docker compose -p controlstock-dev up db-dev -d
#
# 2. ENTORNO DE DESARROLLO COMPLETO (todo en Docker - perfil "dev"):
#      docker compose -p controlstock-dev --profile dev up --build
#
# 3. ENTORNO DE PRODUCCION (todo en Docker - perfil "prod"):
#      docker compose -p controlstock-prod --profile prod up --build -d
#
# 4. AMBOS ENTORNOS SIMULTANEAMENTE:
#      docker compose -p controlstock-dev --profile dev up --build -d
#      docker compose -p controlstock-prod --profile prod up --build -d
# =============================================================================

services:

  # ===========================================================================
  # Perfil: dev - Base de Datos de Desarrollo
  # ===========================================================================
  db-dev:
    profiles:
      - dev
    image: postgres:16.13-alpine3.23
    container_name: controlstock-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: controlstock
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    labels:
      - "com.docker.compose.project=controlstock-dev"
      - "environment=development"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d controlstock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - controlstock-net-dev

  # ===========================================================================
  # Perfil: dev - Backend (Spring Boot con DevTools y JDWP)
  # ===========================================================================
  backend-dev:
    profiles:
      - dev
    build:
      context: ./backend/controlstock
      target: dev
    image: controlstock-backend-dev:latest
    container_name: controlstock-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5005:5005"
      - "35729:35729"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-dev:5432/controlstock
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_ADDITIONAL_PATHS: /app/target/classes
      JAVA_OPTS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - ./backend/controlstock:/app
      - m2-cache-dev:/root/.m2
    labels:
      - "com.docker.compose.project=controlstock-dev"
      - "environment=development"
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - controlstock-net-dev

  # ===========================================================================
  # Perfil: dev - Frontend (React + Vite con HMR)
  # ===========================================================================
  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend/controlstock
      target: dev
    image: controlstock-frontend-dev:latest
    container_name: controlstock-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: 1
      CHOKIDAR_INTERVAL: 1000
    volumes:
      - ./frontend/controlstock:/app
      - /app/node_modules
    labels:
      - "com.docker.compose.project=controlstock-dev"
      - "environment=development"
    depends_on:
      - backend-dev
    networks:
      - controlstock-net-dev

  # ===========================================================================
  # Perfil: prod - Base de Datos de Produccion
  # ===========================================================================
  db-prod:
    profiles:
      - prod
    image: postgres:16.13-alpine3.23
    container_name: controlstock-db-prod
    restart: always
    environment:
      POSTGRES_DB: controlstock
      POSTGRES_USER: admin_prod
      POSTGRES_PASSWORD: admin_production_password
    ports:
      - "5434:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_prod -d controlstock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - controlstock-net-prod

  # ===========================================================================
  # Perfil: prod - Backend (Spring Boot optimizado)
  # ===========================================================================
  backend-prod:
    profiles:
      - prod
    build:
      context: ./backend/controlstock
      target: prod
    image: controlstock-backend-prod:latest
    container_name: controlstock-backend-prod
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-prod:5432/controlstock
      SPRING_DATASOURCE_USERNAME: admin_prod
      SPRING_DATASOURCE_PASSWORD: admin_production_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"
    ports:
      - "8081:8080"
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - controlstock-net-prod

  # ===========================================================================
  # Perfil: prod - Frontend (React + Nginx)
  # ===========================================================================
  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend/controlstock
      target: prod
    image: controlstock-frontend-prod:latest
    container_name: controlstock-frontend-prod
    restart: always
    ports:
      - "80:80"
    labels:
      - "com.docker.compose.project=controlstock-prod"
      - "environment=production"
    depends_on:
      - backend-prod
    networks:
      - controlstock-net-prod

# =============================================================================
# Redes
# =============================================================================
networks:
  controlstock-net-dev:
    name: controlstock_network_dev
    driver: bridge
  controlstock-net-prod:
    name: controlstock_network_prod
    driver: bridge

# =============================================================================
# Volumenes
# =============================================================================
volumes:
  pgdata_dev:
    name: controlstock_pgdata_dev
  m2-cache-dev:
    name: controlstock_m2_cache_dev
  pgdata_prod:
    name: controlstock_pgdata_prod