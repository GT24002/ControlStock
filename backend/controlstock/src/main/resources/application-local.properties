# =============================================================================
# Perfil "local": Para desarrollo con PostgreSQL en Docker y Backend en IntelliJ
# =============================================================================
# Usa este perfil cuando corras el backend desde IntelliJ (no en contenedor).
# PostgreSQL debe estar corriendo en Docker: docker compose up -d db
#
# Activacion en IntelliJ:
#   Run -> Edit Configurations -> Active profiles: local
