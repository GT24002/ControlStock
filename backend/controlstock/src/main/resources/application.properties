# =============================================================================
# Configuracion base de Spring Boot
# =============================================================================
# Esta configuracion se usa por defecto (modo hibrido: backend local + BD en Docker).
# Cuando se ejecuta en contenedor Docker, docker-compose.yml sobrescribe estas
# propiedades mediante variables de entorno (SPRING_DATASOURCE_URL, etc.).
#
# La base de datos PostgreSQL expone el puerto 5433 en el host para evitar
# conflictos con otras instalaciones locales de PostgreSQL en el puerto 5432.
# =============================================================================

spring.application.name=controlstock

# --- PostgreSQL (modo hibrido: localhost:5433 en el host) ---
# En modo Todo-en-Docker, docker-compose.yml sobrescribe con:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db-dev:5432/controlstock   (perfil dev)
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db-prod:5432/controlstock  (perfil prod)
#   SPRING_DATASOURCE_USERNAME=<segun perfil>
#   SPRING_DATASOURCE_PASSWORD=<segun perfil>
spring.datasource.url=jdbc:postgresql://localhost:5433/controlstock
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

server.port=8080

# --- DevTools (Hot Reload en desarrollo local) ---
# Se activa automaticamente cuando se ejecuta desde el IDE (fuera de Docker).
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true