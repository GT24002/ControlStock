# =============================================================================
# Configuracion base de Spring Boot
# =============================================================================
# Esta configuracion se usa por defecto (modo hibrido: backend local + BD en Docker).
# Cuando se ejecuta en contenedor Docker, docker-compose.yml sobrescribe estas
# propiedades mediante variables de entorno (SPRING_DATASOURCE_URL, etc.).
#
# La base de datos PostgreSQL expone el puerto 5433 en el host para evitar
# conflictos con otras instalaciones locales de PostgreSQL en el puerto 5432.
# =============================================================================

spring.application.name=controlstock
spring.datasource.url=jdbc:postgresql://localhost:5432/controlstockdb
spring.datasource.username=postgres
spring.datasource.password=Volterra1029
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.port=8080
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
logging.level.org.springframework.security=DEBUG
