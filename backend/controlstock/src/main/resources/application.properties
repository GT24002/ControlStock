# =============================================================================
# Configuracion base de Spring Boot
# =============================================================================
# Por defecto, apunta a PostgreSQL corriendo en Docker.
# Para desarrollo local con IntelliJ, activa el perfil "local":
#   --spring.profiles.active=local
# =============================================================================

spring.application.name=controlstock

# --- PostgreSQL (contenedor Docker en localhost:5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/controlstock
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

server.port=8080
