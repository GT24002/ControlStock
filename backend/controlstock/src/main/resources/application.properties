# =============================================================================
# Configuracion base de Spring Boot
# =============================================================================
# Esta configuracion se usa por defecto (modo hibrido: backend local + BD en Docker).
# Cuando se ejecuta en contenedor Docker, docker-compose.yml sobrescribe estas
# propiedades mediante variables de entorno (SPRING_DATASOURCE_URL, etc.).
#
# La base de datos PostgreSQL expone el puerto 5433 en el host para evitar
# conflictos con otras instalaciones locales de PostgreSQL en el puerto 5432.
#
# Para desarrollo local con IntelliJ, activa el perfil "local":
#   --spring.profiles.active=local
# =============================================================================

spring.application.name=controlstock

# --- PostgreSQL (modo hibrido: localhost:5433 en el host) ---
# En modo Todo-en-Docker, docker-compose.yml sobrescribe con:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db-dev:5432/controlstock
#   SPRING_DATASOURCE_USERNAME=admin
#   SPRING_DATASOURCE_PASSWORD=admin123
spring.datasource.url=jdbc:postgresql://localhost:5433/controlstock
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

server.port=8080
